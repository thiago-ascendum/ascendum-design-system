name: Design system checks

on:
  push:
  pull_request:

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Where this snapshot comes from
        # The Figma version the tokens were read from, and the alias graph that links them.
        run: |
          python3 - <<'PY'
          import json
          m = json.load(open("build/ds-snapshot.json"))["meta"]
          v = m.get("figmaVersion") or {}
          print("Figma file   ", m.get("fileKey") or m["sourceSha256"])
          print("Figma version", v.get("id") or "not recorded", "·", v.get("title") or "", "·", v.get("savedAt") or "")
          print("Aliases      ", m.get("aliasCount", "not recorded"))
          PY

      - name: Design checks (blocking)
        # Exit code 1 while a blocking check fails: broken alias, colour outside the palette, low contrast, name collision.
        run: python3 pipeline/02_build.py build/ds-snapshot.json governance build && python3 pipeline/04_catalogue.py build/ds-snapshot.json build

      - name: Breaking changes (blocking)
        # A token, component, property or text style a consumer would lose stops the pipeline,
        # unless it is accepted in governance/accepted-breaking.json in the same pull request.
        run: python3 pipeline/05_breaking.py build/before/ds-snapshot.json build/ds-snapshot.json build/breaking.json governance/accepted-breaking.json

      - name: Code checks (blocking)
        # No colour typed by hand in a component stylesheet, and no undefined custom property.
        run: python3 pipeline/06_code_checks.py build/tokens.css src/components

      - name: Every change since the file as received
        # The full list for the changelog, matched by Figma id. Written from the files, not from memory.
        run: python3 pipeline/06_changes.py build/before/ds-snapshot.json build/ds-snapshot.json build

      - name: Migration keeps identities (blocking)
        # Builds the migration from the file as received to this one, runs it on a simulated copy of the old file
        # and fails if any variable differs or loses its Figma id (bound layers would come loose).
        run: python3 pipeline/09_migrate.py build/before/ds-snapshot.json build/ds-snapshot.json governance/accepted-breaking.json build && node pipeline/tests/migrate_sim.mjs build/before/ds-snapshot.json build/ds-snapshot.json build/migrate.figma.js

      - name: Generated files match the snapshot
        # Tokens and the AI contract are never edited by hand.
        run: git diff --exit-code -- build/tokens.json build/tokens.css build/AI-CONTRACT.md build/components.json build/text-styles.json build/contracts.json build/breaking.json build/migration-plan.json build/migrate.figma.js build/changes.json build/CHANGES.md

      - name: Before and after
        run: python3 pipeline/03_compare.py build/before/report.json build/report.json build/compare.js

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-system-report
          path: |
            build/report.json
            build/breaking.json
            build/AI-CONTRACT.md

  components:
    name: Components and documentation build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the documentation site
        # A component or a page that does not build stops here.
        run: npm run build:site
      - uses: actions/upload-artifact@v4
        with:
          name: storybook-build
          path: dist

  publish:
    name: Publish
    # Runs only when every check passed. A red gate means this job is skipped and nothing is published.
    # On a pull request it publishes a preview build (an artifact). On main it publishes the site on GitHub Pages.
    needs: [gate, components]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && 'github-pages' || 'preview' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: storybook-build
          path: dist
      - name: Preview for this pull request
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: preview-site
          path: dist
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: dist
      - name: Publish on GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/deploy-pages@v4
