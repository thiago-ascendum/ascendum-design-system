# Publishes the documentation site on every push: Storybook at the root, the health report at /report/.
[build]
  # The gate runs first. If a blocking check fails, the command stops and nothing is published.
  command = "python3 pipeline/02_build.py build/ds-snapshot.json governance build && npm ci && npm run build:site"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Keep the site out of search engines. The link is for the team.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
